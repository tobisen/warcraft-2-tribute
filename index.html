<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>warcraft-2-tribute</title>
  </head>
  <body>
    <section id="hud" aria-label="Matchstatus och kommandon">
      <div id="match-overview">
        <span id="resource-status"></span><span id="health-status"></span><span id="wave-status"></span><span id="population-status"></span>
      </div>
      <div id="production-controls">
        <div class="control"><button id="train-worker" type="button" disabled>Träna arbetare – 20 wood</button>
          <span id="production-status"></span></div>
        <div class="control"><button id="build-barracks" type="button">Bygg barracks – 40 wood</button>
          <span id="placement-status"></span></div>
        <div class="control"><button id="train-soldier" type="button" disabled>Träna soldier – 20 wood + 5 gold</button>
          <span id="soldier-production-status"></span></div>
        <div class="control"><button id="build-farm" type="button" disabled>Bygg farm – 20 wood</button><span id="farm-status"></span></div>
      </div>
      <div id="production-queue" aria-label="Produktionskö"></div>
      <button id="attack-move" type="button" disabled>Attack-move</button>
      <button id="stop-units" type="button" disabled>Stop</button>
      <p id="selection-status"></p>
      <p id="match-status" role="status">Försvara basen</p>
      <div id="restart-slot"><button id="restart-match" type="button" hidden>Starta om</button></div>
    </section>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

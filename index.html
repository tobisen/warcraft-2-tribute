<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>warcraft-2-tribute</title>
  </head>
  <body>
    <div id="production-controls">
      <button id="train-worker" type="button" disabled>Träna arbetare – 20 wood</button>
      <span id="production-status" role="status">Bas ledig</span>
      <button id="build-barracks" type="button">Bygg barracks – 40 wood</button>
      <span id="placement-status" role="status"></span>
      <button id="train-soldier" type="button" hidden disabled>Träna soldier – 20 wood</button>
      <span id="soldier-production-status" role="status" hidden></span>
    </div>
    <p id="match-status" role="status">Försvara basen</p>
    <button id="restart-match" type="button" hidden>Starta om</button>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
